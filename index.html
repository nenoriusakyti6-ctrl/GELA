<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<title>GELA – Mini Dienynas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>GELA – Mini Dienynas</h1>

<div id="auth-section">
  <h2>Prisijungimas / Registracija</h2>
  <input type="email" id="email" placeholder="El. paštas">
  <input type="password" id="password" placeholder="Slaptažodis">
  <select id="role">
    <option value="admin">Admin</option>
    <option value="teacher">Mokytojas</option>
    <option value="student">Mokinys</option>
    <option value="parent">Tėvai</option>
  </select>
  <button onclick="register()">Registruotis</button>
  <button onclick="login()">Prisijungti</button>
</div>

<div id="app-section" style="display:none;">
  <h2>Sveiki, <span id="user-name"></span> (<span id="user-role"></span>)</h2>
  <button onclick="logout()">Atsijungti</button>
  <div id="dashboard"></div>
</div>

<!-- Firebase compat CDN -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAvkDsz6eAoPN2dMqvoTho5xv1yc490V7A",
  authDomain: "gela-34020.firebaseapp.com",
  projectId: "gela-34020",
  storageBucket: "gela-34020.firebasestorage.app",
  messagingSenderId: "668623580567",
  appId: "1:668623580567:web:cc1ea4582d3018978fa8d2",
  measurementId: "G-RNP6YBNGRM"
};

// Init Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// Registration
function register(){
  const email=document.getElementById('email').value;
  const password=document.getElementById('password').value;
  const role=document.getElementById('role').value;
  auth.createUserWithEmailAndPassword(email,password)
  .then(userCredential => {
    return db.collection('users').doc(userCredential.user.uid).set({email,role});
  })
  .then(()=>alert("Registracija sėkminga"))
  .catch(err=>alert(err.message));
}

// Login
function login(){
  const email=document.getElementById('email').value;
  const password=document.getElementById('password').value;
  auth.signInWithEmailAndPassword(email,password)
  .then(userCredential => {
    return db.collection('users').doc(userCredential.user.uid).get();
  })
  .then(docSnap=>{
    document.getElementById('auth-section').style.display='none';
    document.getElementById('app-section').style.display='block';
    document.getElementById('user-name').innerText=document.getElementById('email').value;
    document.getElementById('user-role').innerText=docSnap.data().role;
    loadDashboard(docSnap.data().role);
  })
  .catch(err=>alert(err.message));
}

// Logout
function logout(){
  auth.signOut();
  document.getElementById('auth-section').style.display='block';
  document.getElementById('app-section').style.display='none';
}

// Dashboard
function loadDashboard(role){
  const dash=document.getElementById('dashboard');
  dash.innerHTML="";
  if(role==="admin"){
    dash.innerHTML+="<h3>Admin modulis</h3><button onclick='createClass()'>Kurti klasę</button><div id='classes-list'></div>";
    loadClasses();
  } else if(role==="teacher"){
    dash.innerHTML+="<h3>Mokytojo modulis</h3><div id='teacher-actions'>Funkcijos čia</div>";
  } else if(role==="student"){
    dash.innerHTML+="<h3>Mokinio modulis</h3><p>Funkcijos čia</p>";
  } else if(role==="parent"){
    dash.innerHTML+="<h3>Tėvų modulis</h3><p>Funkcijos čia</p>";
  }
}

// Admin functions
function createClass(){
  const className=prompt("Įveskite klasės pavadinimą:");
  if(!className) return;
  db.collection('classes').doc(className).set({name:className,students:[],teachers:[]})
  .then(()=>loadClasses());
}

function loadClasses(){
  db.collection('classes').get().then(snapshot=>{
    let html="<ul>";
    snapshot.forEach(doc=>{html+=`<li>${doc.id}</li>`});
    html+="</ul>";
    document.getElementById('classes-list').innerHTML=html;
  });
}
</script>

</body>
</html>
