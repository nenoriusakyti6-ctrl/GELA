<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<title>Dienynas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Dienynas</h1>

<div id="auth-section">
  <h2>Prisijungimas</h2>
  <input type="email" id="email" placeholder="El. paštas">
  <input type="password" id="password" placeholder="Slaptažodis">
  <button id="login-btn">Prisijungti</button>
</div>

<div id="app-section" style="display:none;">
  <h2>Sveiki, <span id="user-name"></span> (<span id="user-role"></span>)</h2>
  <button id="logout-btn">Atsijungti</button>
  <div id="dashboard"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="main.js"></script>
</body>
</html>
